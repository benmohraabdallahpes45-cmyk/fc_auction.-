<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FC Auction Online</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#02070d;color:#fff;font-family:Arial,Tahoma,sans-serif;padding:7px}
.app{max-width:1200px;margin:auto}.card{background:#0a1420;border:1px solid #29445e;border-radius:16px;padding:10px;margin:7px 0}
h1{text-align:center;margin:4px 0;font-size:clamp(24px,7vw,40px)}.sub{text-align:center;color:#9fb1c3;font-size:12px}
.status{padding:9px;border-radius:11px;background:#12243a;text-align:center;font-weight:900}.ok{background:#063a29;color:#55efae}.bad{background:#461821;color:#ffb7bf}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
input{width:100%;padding:12px;margin-top:6px;border-radius:11px;border:1px solid #38536c;background:#06131f;color:#fff;font-size:16px}
button{width:100%;padding:12px;margin-top:7px;border:0;border-radius:11px;font-weight:900;cursor:pointer;background:#20df91;color:#06101b}
.blue{background:#1688ff;color:white}.red{background:#ff566b;color:white}.dark{background:#193048;color:white}button:disabled{opacity:.35}
.hidden{display:none!important}.roomcode{text-align:center;font-size:28px;color:#54efae;font-weight:1000;letter-spacing:5px}
.arena{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px}@media(max-width:950px){.arena{grid-template-columns:1fr}}
.side{min-height:560px;padding:8px;border-radius:17px;border:2px solid}.bs{background:#062d58;border-color:#1688ff}.rs{background:#58162c;border-color:#ff566b}
.side h3{text-align:center;margin:3px}.money{text-align:center;color:#54efae;font-size:20px;font-weight:1000}
.pitch{position:relative;height:500px;border-radius:13px;overflow:hidden;background:linear-gradient(90deg,#0b6b35 50%,#086130 50%);border:2px solid #fff5}
.line{position:absolute;inset:8px;border:2px solid #ffffff70}.half{position:absolute;left:0;right:0;top:50%;border-top:2px solid #fff8}
.circle{position:absolute;width:70px;height:70px;border:2px solid #fff8;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.pos{position:absolute;transform:translate(-50%,-50%);width:52px;text-align:center;font-size:7px;font-weight:900}.slot{width:45px;min-height:50px;background:#061522dd;border:1px solid #fff6;border-radius:8px;margin:auto;padding:2px}
.slot img{width:27px;height:27px;object-fit:cover;border-radius:50%}.slot b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:6px}
.gk{left:50%;top:91%}.rb{left:82%;top:78%}.cb1{left:61%;top:74%}.cb2{left:39%;top:74%}.lb{left:18%;top:78%}
.dmf{left:50%;top:62%}.cmf{left:50%;top:50%}.amf{left:50%;top:37%}.rwf{left:76%;top:24%}.lwf{left:24%;top:24%}.cf{left:50%;top:12%}
.center{background:#07111c;border:2px solid #315673;border-radius:17px;padding:9px;text-align:center;min-height:560px}
.turnBlue{border-color:#1688ff!important;box-shadow:0 0 22px #1688ff66}.turnRed{border-color:#ff566b!important;box-shadow:0 0 22px #ff566b66}
.fc{width:min(280px,95%);margin:5px auto;background:linear-gradient(145deg,#f0d27b,#76501b 48%,#d7b65c);color:#211605;border:3px solid #f8df91;border-radius:15px;padding:9px}
.fc img{width:125px;height:125px;display:block;margin:8px auto;object-fit:contain;border-radius:50%;background:#10263b;border:3px solid #fae9a9}
.fcname{font-size:19px;font-weight:1000}.price{font-size:28px;color:#54efae;font-weight:1000}
.turn{padding:7px;border-radius:10px;background:#172534;margin:5px 0;font-weight:900}.progress{display:grid;grid-template-columns:repeat(11,1fr);gap:2px}.dot{height:5px;background:#23384d;border-radius:8px}.done{background:#54efae}.cur{background:#ffd54a}
.modal{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:10px;z-index:10}.modalbox{max-width:520px;width:96%;background:#0b1928;border:2px solid #3b5f7e;border-radius:18px;padding:13px;text-align:center}
.results{display:grid;grid-template-columns:1fr 1fr;gap:7px}.result{background:#111f2f;border-radius:12px;padding:7px}.result img{width:75px;height:75px;object-fit:contain;border-radius:50%}
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111f2e;border:1px solid #36546e;border-radius:12px;padding:10px 14px;z-index:20;display:none;max-width:92%}
</style>
</head>
<body>
<div class="app">
<h1>⚽ FC AUCTION ONLINE</h1><div class="sub">كل قائمة = سيناريو مستقل بـ22 لاعباً مختلفاً</div>
<div id="status" class="status">جاري الاتصال...</div>

<section id="home" class="card"><h2>🏠 الغرفة</h2><div class="grid">
<div><input id="name1" placeholder="اسم اللاعب الأول"><button class="blue" onclick="createRoom()">إنشاء غرفة</button></div>
<div><input id="name2" placeholder="اسم اللاعب الثاني"><input id="code" maxlength="6" placeholder="كود الغرفة"><button class="red" onclick="joinRoom()">دخول لاعب ثاني</button></div>
</div></section>

<section id="room" class="hidden">
<div id="setup" class="card"><div>كود الغرفة</div><div id="roomCode" class="roomcode">------</div>
<div id="players" class="grid"></div><div id="pool" class="card">قاعدة اللاعبين لم تُجهز بعد.</div>
<button id="start" class="hidden" onclick="startGame()">▶️ بدء اللعبة</button></div>

<div id="game" class="hidden">
<div id="scenario" class="card" style="text-align:center;font-weight:900"></div>
<div class="arena">
<div class="side bs"><h3>🔵 <span id="bn"></span></h3><div id="bm" class="money">200M</div><div id="bp" class="pitch"></div></div>
<div id="auction" class="center">
<div>⚡ مزاد اللاعب</div><div id="progress" class="progress"></div>
<div class="fc"><div id="position">GK</div><img id="photo"><div id="pname" class="fcname">—</div><div id="meta">—</div></div>
<div id="price" class="price">0M</div><div id="turn" class="turn">—</div>
<input id="bid" type="number" min="1" placeholder="مبلغ المزايدة">
<button id="bidBtn" onclick="bid()">💰 زايد</button><button id="passBtn" class="dark" onclick="pass()">↩️ انسحاب</button>
</div>
<div class="side rs"><h3>🔴 <span id="rn"></span></h3><div id="rm" class="money">200M</div><div id="rp" class="pitch"></div></div>
</div>
<div id="finish" class="card hidden"><div id="score"></div><button id="next" class="blue hidden" onclick="newScenario()">🎲 قائمة جديدة بـ22 لاعباً مختلفاً</button></div>
</div></section>
</div>

<div id="modal" class="modal hidden"><div class="modalbox"><h2 id="mt"></h2><div id="mx"></div><div id="mr" class="results"></div><button onclick="continueAuction()">OK — متابعة</button></div></div>
<div id="toast" class="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAGKh-bNXYBVbv0BcIIxi8IHR4a0leSA",authDomain:"fc-auction-online.firebaseapp.com",databaseURL:"https://fc-auction-online-default-rtdb.europe-west1.firebasedatabase.app",projectId:"fc-auction-online",storageBucket:"fc-auction-online.firebasestorage.app",messagingSenderId:"131249827121",appId:"1:249827121:web:eae71599ef1f8fda28d410"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const API="https://www.thesportsdb.com/api/v1/json/123";
const leagues=["English_Premier_League","Spanish_La_Liga","Italian_Serie_A","German_Bundesliga","French_Ligue_1"];
const FORM=[
["GK","gk"],["RB","rb"],["CB","cb1"],["CB","cb2"],["LB","lb"],["DMF","dmf"],["CMF","cmf"],["AMF","amf"],["RWF","rwf"],["LWF","lwf"],["CF","cf"]
];
const POS=["GK","RB","CB","LB","DMF","CMF","AMF","RWF","LWF","CF"];
let id=localStorage.fcAuctionId||(localStorage.fcAuctionId="p_"+Math.random().toString(36).slice(2)+Date.now());
let ref,code="",side="",host=false,room=null,modal=false,apiQ=Promise.resolve(),lastApi=0;
const $=x=>document.getElementById(x),sleep=x=>new Promise(r=>setTimeout(r,x));
function toast(x){$("toast").textContent=x;$("toast").style.display="block";clearTimeout(window.toastT);window.toastT=setTimeout(()=>$("toast").style.display="none",3500)}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function other(x){return x==="blue"?"red":"blue"}
function api(url){apiQ=apiQ.then(async()=>{let w=Math.max(0,1900-(Date.now()-lastApi));if(w)await sleep(w);for(let i=0;i<3;i++){lastApi=Date.now();try{let r=await fetch(url,{cache:"no-store"});if(r.status===429){await sleep(65000);continue}if(!r.ok)throw Error(r.status);return await r.json()}catch(e){if(i===2)throw e;await sleep(2500)}}});return apiQ}
function strict(raw){
 let s=String(raw||"").trim().toLowerCase().replace(/[–—]/g,"-").replace(/\s+/g," ");
 const m={
  GK:["gk","goalkeeper","goal keeper"],RB:["rb","right-back","right back"],LB:["lb","left-back","left back"],
  CB:["cb","centre-back","centre back","center-back","center back"],
  DMF:["dm","dmf","defensive-midfield","defensive midfield","defensive midfielder"],
  CMF:["cm","cmf","central-midfield","central midfield","central midfielder"],
  AMF:["am","amf","attacking-midfield","attacking midfield","attacking midfielder"],
  RWF:["rw","rwf","right-wing","right wing","right-winger","right winger"],
  LWF:["lw","lwf","left-wing","left wing","left-winger","left winger"],
  CF:["cf","st","striker","centre-forward","centre forward","center-forward","center forward"]
 };
 for(const k of Object.keys(m))if(m[k].includes(s))return k;return null
}
function player(p){
 const position=strict(p?.strPosition),image=p?.strCutout||p?.strThumb||"",pid=String(p?.idPlayer||""),name=String(p?.strPlayer||"").trim();
 if(!position||!image||!pid||!name)return null;
 return{id:pid,name,position,nationality:p.strNationality||"—",club:p.strTeam||"—",image};
}
const CK="fcStrictHugeDB4";
function cache(){try{let x=JSON.parse(localStorage.getItem(CK)||"null");return Array.isArray(x)?x:null}catch{return null}}
function uniq(a){let ids=new Set(),names=new Set(),o=[];for(const p of a||[]){let n=p.name.toLowerCase();if(!ids.has(p.id)&&!names.has(n)){ids.add(p.id);names.add(n);o.push(p)}}return o}
async function database(){
 let c=cache();if(c&&c.length>=250){$("pool").textContent="📦 قاعدة جاهزة: "+c.length+" لاعب صالح";return c}
 let teams=[];toast("🌍 جلب أندية الدوريات الخمس...");
 for(const l of leagues){let d=await api(API+"/search_all_teams.php?l="+encodeURIComponent(l));teams.push(...(d?.teams||[]).slice(0,12))}
 let map=new Map();teams.forEach(t=>map.set(String(t.idTeam),t));teams=shuffle([...map.values()]);
 let all=[];
 for(let i=0;i<teams.length;i++){let d=await api(API+"/lookup_all_players.php?id="+teams[i].idTeam);all=uniq(all.concat((d?.player||[]).map(player).filter(Boolean)));$("pool").textContent="📥 "+all.length+" لاعب صالح — النادي "+(i+1)+"/"+teams.length}
 all=uniq(all);localStorage.setItem(CK,JSON.stringify(all));return all
}
/* IMPORTANT: كل سيناريو يأخذ 2 لاعب لكل مركز = 20 + 2 حراس؟ لا، CB محسوب مرة واحدة
   لأن التشكيلة فيها 11 مركزاً: GK,RB,CB,LB,DMF,CMF,AMF,RWF,LWF,CF =10 أنواع،
   وCB له خانتان. لذلك نحتاج: 2 لكل نوع + لاعب إضافي CB =22. */
function makeScenario(pool,history){
 const used=new Set((history||[]).slice(-1000)),by={};POS.forEach(p=>by[p]=shuffle(pool.filter(x=>x.position===p&&!used.has(x.id))));
 const need={GK:2,RB:2,CB:4,LB:2,DMF:2,CMF:2,AMF:2,RWF:2,LWF:2,CF:2};
 let out=[];for(const p of POS){if(by[p].length<need[p])return null;out.push(...by[p].slice(0,need[p]))}
 return shuffle(out)
}
async function createRoom(){
 let n=$("name1").value.trim();if(!n)return toast("اكتب الاسم");
 let c;do{c=Math.random().toString(36).slice(2,8).toUpperCase()}while((await db.ref("rooms/"+c).once("value")).exists());
 code=c;side="blue";host=true;ref=db.ref("rooms/"+c);
 await ref.set({status:"waiting",players:{blue:{id,name:n,budget:200,team:{}},red:null},pool:[],scenario:[],history:[],scenarioNo:0,index:0,auction:null,resolution:null});
 listen();showRoom()
}
async function joinRoom(){
 let n=$("name2").value.trim(),c=$("code").value.trim().toUpperCase();if(!n||!c)return toast("أكمل البيانات");
 let r=db.ref("rooms/"+c),s=await r.once("value");if(!s.exists())return toast("الغرفة غير موجودة");if(s.val().players.red)return toast("الغرفة ممتلئة");
 code=c;side="red";host=false;ref=r;await r.child("players/red").set({id,name:n,budget:200,team:{}});await r.update({status:"ready"});listen();showRoom()
}
function listen(){ref.on("value",s=>{room=s.val();render()})}
function showRoom(){$("home").classList.add("hidden");$("room").classList.remove("hidden");$("roomCode").textContent=code}
async function startGame(){
 if(!host||!room.players.red)return toast("انتظر اللاعب الثاني");$("start").disabled=true;
 try{let p=await database(),sc=makeScenario(p,[]);if(!sc)return toast("❌ القاعدة لا تكفي لمركز من المراكز الصارمة");
 await ref.update({status:"playing",pool:p,scenario:sc,history:sc.map(x=>x.id),scenarioNo:1,index:0,auction:null,resolution:null,players:{blue:{...room.players.blue,budget:200,team:{}},red:{...room.players.red,budget:200,team:{}}}});
 setTimeout(nextAuction,1500);toast("🎲 السيناريو 1: 22 لاعباً مختلفاً")
 }catch(e){toast("❌ "+e.message)}finally{$("start").disabled=false}
}
async function nextAuction(){
 if(!host)return;let s=await ref.once("value"),r=s.val();if(!r||r.status!=="playing"||r.auction||r.resolution)return;
 if(r.index>=11)return finish();
 const pos=FORM[r.index][0],arr=r.scenario.filter(x=>x.position===pos&&!r.used?.includes(x.id));
 if(arr.length<2)return toast("❌ خطأ في سيناريو المركز "+pos);
 let a=shuffle(arr).slice(0,2);
 await ref.update({auction:{player:a[0],reserve:a[1],position:pos,price:0,highest:null,active:true},turn:"blue",turnAt:Date.now()+1000})
}
async function bid(){
 if(!room.auction||room.turn!==side||Date.now()<room.turnAt)return;
 let v=Number($("bid").value),me=room.players[side],cur=Number(room.auction.price||0);
 if(v<=cur||v>me.budget)return toast(v>me.budget?"الرصيد لا يكفي":"المبلغ يجب أن يكون أكبر");
 if(Object.keys(me.team||{}).length>=11)return;
 await ref.update({"auction/price":v,"auction/highest":side,turn:other(side),turnAt:Date.now()+2200});$("bid").value=""
}
async function pass(){
 if(!room.auction||room.turn!==side||Date.now()<room.turnAt)return;
 let a=room.auction;
 await ref.update({auction:null,resolution:{id:Date.now()+Math.random(),type:a.highest?"win":"free",winner:a.highest,winnerPlayer:a.player,reserve:a.reserve,price:a.price||0,receiver:a.highest?other(a.highest):side,position:a.position,committed:false}})
}
function addSlot(team,p,position){
 let t={...team},slot=position;if(position==="CB")slot=!t.CB1?"CB1":"CB2";t[slot]=p;return t
}
function resultModal(res){
 if(modal)return;modal=true;$("modal").classList.remove("hidden");
 if(res.type==="win"){$("mt").textContent="🏆 تم حسم المزاد";$("mx").textContent="الفائز دفع "+res.price+"M واللاعب الآخر أخذ الاحتياطي من نفس المركز";$("mr").innerHTML=box(res.winnerPlayer,"🏆 الفائز")+box(res.reserve,"🎁 مجاني")}
 else{$("mt").textContent="🎁 لا توجد مزايدة";$("mx").textContent="اللاعب الذي انسحب أخذ اللاعب مجاناً";$("mr").innerHTML=box(res.winnerPlayer,"🎁 مجاني")}
}
function box(p,t){return `<div class="result"><img src="${esc(p.image)}"><b>${t}</b><br>${esc(p.name)}<br><small>${esc(p.position)} · ${esc(p.club)}</small></div>`}
async function continueAuction(){
 if(!modal||!room.resolution)return;modal=false;$("modal").classList.add("hidden");
 let s=await ref.once("value"),r=s.val(),x=r.resolution;if(x.committed)return;
 let updates={},used=[...(r.used||[])];
 if(x.type==="win"){
  let wt=addSlot(r.players[x.winner].team,x.winnerPlayer,x.position),lt=addSlot(r.players[x.receiver].team,x.reserve,x.position);
  updates["players/"+x.winner+"/team"]=wt;updates["players/"+x.winner+"/budget"]=Number(r.players[x.winner].budget)-Number(x.price);
  updates["players/"+x.receiver+"/team"]=lt;used.push(x.winnerPlayer.id,x.reserve.id)
 }else{
  let t=addSlot(r.players[x.receiver].team,x.winnerPlayer,x.position);updates["players/"+x.receiver+"/team"]=t;used.push(x.winnerPlayer.id)
 }
 updates.used=[...new Set(used)];updates.index=r.index+1;updates.turn="blue";updates.resolution={...x,committed:true};await ref.update(updates);
 /* متابعة -> 3 ثواني قبل المزاد التالي */
 setTimeout(async()=>{let q=await ref.once("value"),z=q.val();if(z.status==="playing"&&z.resolution?.committed&&!z.auction)nextAuction()},3000)
}
async function finish(){
 let s=await ref.once("value"),r=s.val();if(!r||r.index<11)return;
 await ref.update({status:"finished",auction:null});toast("🏆 اكتملت التشكيلتان")
}
async function newScenario(){
 if(!host||room.status!=="finished")return;
 let p=room.pool,history=room.history||[],sc=makeScenario(p,history);
 if(!sc)return toast("⚠️ لا يوجد 22 لاعباً جديداً. يلزم توسيع قاعدة اللاعبين.");
 let h=[...history,...sc.map(x=>x.id)];
 await ref.update({status:"playing",scenario:sc,history:h,scenarioNo:Number(room.scenarioNo||1)+1,index:0,used:[],auction:null,resolution:null,
 players:{blue:{...room.players.blue,budget:200,team:{}},red:{...room.players.red,budget:200,team:{}}}});
 $("finish").classList.add("hidden");setTimeout(nextAuction,3000)
}
function pitch(team){let s=`<div class="line"><div class="half"></div><div class="circle"></div></div>`;for(const [p,c] of FORM){let key=c==="cb1"||c==="cb2"?c:p.toLowerCase();let x=team[key]||team[p];s+=`<div class="pos ${c}"><div>${p}</div><div class="slot">${x?`<img src="${esc(x.image)}"><b>${esc(x.name)}</b>`:"—"}</div></div>`}return s}
function render(){
 if(!room)return;
 let b=room.players?.blue,r=room.players?.red;
 if(room.status==="waiting"||room.status==="ready"){
  $("setup").classList.remove("hidden");$("game").classList.add("hidden");$("players").innerHTML=`<div class="card">🔵 ${esc(b?.name||"—")}</div><div class="card">🔴 ${esc(r?.name||"—")}</div>`;$("start").classList.toggle("hidden",!(host&&r));return
 }
 $("setup").classList.add("hidden");$("game").classList.remove("hidden");
 $("bn").textContent=b.name;$("rn").textContent=r.name;$("bm").textContent=b.budget+"M";$("rm").textContent=r.budget+"M";
 $("scenario").textContent="🎲 سيناريو #"+room.scenarioNo+" — Pool مستقل من 22 لاعباً";
 $("bp").innerHTML=pitch(b.team);$("rp").innerHTML=pitch(r.team);
 $("progress").innerHTML=Array.from({length:11},(_,i)=>`<i class="dot ${i<room.index?"done":i===room.index?"cur":""}"></i>`).join("");
 if(room.auction){
  let a=room.auction,p=a.player;$("photo").src=p.image;$("pname").textContent=p.name;$("position").textContent=p.position;$("meta").textContent=p.nationality+" · "+p.club;$("price").textContent=(a.price||0)+"M";
  $("auction").className="center "+(room.turn==="blue"?"turnBlue":"turnRed");let me=room.turn===side&&Date.now()>=room.turnAt;
  $("turn").textContent=me?"🎯 دورك":"⏳ دور اللاعب الآخر";$("bidBtn").disabled=!me;$("passBtn").disabled=!me;$("bid").disabled=!me
 }else{$("auction").className="center";$("pname").textContent="انتظر";$("bidBtn").disabled=true;$("passBtn").disabled=true}
 if(room.resolution&&!room.resolution.committed)resultModal(room.resolution);
 if(room.status==="finished"){$("finish").classList.remove("hidden");$("score").innerHTML="<h2>🏆 انتهت القائمة</h2><p>تم استعمال 22 لاعباً في هذا السيناريو. القائمة القادمة ستسحب 22 لاعباً مختلفين.</p>";$("next").classList.toggle("hidden",!host)}
}
$("status").textContent="متصل بقاعدة البيانات";$("status").className="status ok";
setInterval(()=>{if(room?.auction)render()},400);
</script>
</body>
</html>
