<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC Auction ProMax</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:#fff;font-family:Arial;padding:10px}.app{max-width:1200px;margin:auto}.card,.side{background:#0d1b2b;border:1px solid #29445e;border-radius:22px;padding:15px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:800px){.grid,.arena{grid-template-columns:1fr!important}}input{width:100%;padding:14px;border-radius:12px;border:1px solid #456;background:#071522;color:#fff;margin-top:8px}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#20df91;font-weight:900;margin-top:8px}.secondary{background:#20364d;color:#fff}.status{text-align:center;padding:11px;border-radius:12px;background:#172a3e}.online{background:#073b2a;color:#5bf0b3}.error{background:#4a1820;color:#ffb6bf}.hidden{display:none}.roomCode{font-size:32px;text-align:center;letter-spacing:7px;color:#54efae;font-weight:900}.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px}.blue{border:2px solid #1680ff;background:#06244a}.red{border:2px solid #ff4560;background:#4a0a17}.side{min-height:470px}.pitch{min-height:330px;margin-top:12px;padding:10px;border-radius:18px;background:repeating-linear-gradient(0deg,#08603b 0,#08603b 42px,#0b7045 43px,#0b7045 84px)}.team{display:grid;grid-template-columns:1fr 1fr;gap:7px}.slot{background:#071522dd;border:1px solid #ffffff33;border-radius:10px;padding:5px;text-align:center;font-size:11px}.slot img{width:42px;height:42px;border-radius:50%;object-fit:cover}.center{display:flex;flex-direction:column;justify-content:center;text-align:center;border:2px solid #d5a927}.auction img{width:145px;height:145px;border-radius:50%;object-fit:cover;border:4px solid #d5a927}.aname{font-size:29px;font-weight:1000}.price{font-size:45px;color:#54efae;font-weight:1000}.turn{padding:10px;border-radius:12px;background:#162b3e;font-weight:900;margin:10px 0}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.player{background:#081522;border:1px solid #29445e;border-radius:14px;padding:8px;text-align:center}.player img{width:65px;height:65px;border-radius:50%;object-fit:cover}.coach{display:flex;gap:10px;align-items:center;background:#081522;border-radius:14px;padding:8px}.coach img{width:55px;height:55px;border-radius:50%;object-fit:cover}.log{max-height:180px;overflow:auto}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111f2e;padding:12px 18px;border-radius:13px;display:none;z-index:99}
</style></head><body><div class="app"><h1 style="text-align:center">FC AUCTION ONLINE ⚽</h1><p style="text-align:center;color:#9fb2c4">مزاد ProMax — اللاعب يظهر في الوسط والسعر يبدأ من 0M</p><div id="status" class="status">جاري الاتصال...</div>
<section id="home" class="card"><h2>🏠 الغرفة</h2><div class="grid"><div><input id="name1" placeholder="اسم اللاعب الأول"><button class="btn" onclick="createRoom()">إنشاء غرفة</button></div><div><input id="name2" placeholder="اسم اللاعب الثاني"><input id="roomInput" maxlength="6" placeholder="كود الغرفة"><button class="btn secondary" onclick="joinRoom()">دخول لاعب ثاني</button></div></div></section>
<section id="room" class="hidden"><div class="card"><b>كود الغرفة</b><div id="roomCode" class="roomCode"></div><div id="roomPlayers" class="grid"></div><div id="waiting" class="status">انتظر اللاعب الثاني</div><button id="startBtn" class="btn hidden" onclick="startAuction()">🔥 بدء المزاد</button></div>
<div id="game" class="hidden"><div class="arena"><div class="side blue"><h2>🔵 الأزرق</h2><div id="bn"></div><h2 id="bb">200M</h2><div class="pitch"><div id="bt" class="team"></div></div></div>
<div class="card center"><div>🔥 اللاعب الحالي</div><img id="ai" class="auction"><div id="an" class="aname">—</div><div id="ap">—</div><div id="pr" class="price">0M</div><div id="turn" class="turn">—</div><input id="amount" type="number" min="1" placeholder="اكتب مبلغ المزايدة"><button id="bid" class="btn" onclick="bid()">💰 زايد</button><button id="pass" class="btn secondary" onclick="pass()">❌ لا أريد</button></div>
<div class="side red"><h2>🔴 الأحمر</h2><div id="rn"></div><h2 id="rb">200M</h2><div class="pitch"><div id="rt" class="team"></div></div></div></div>
<div class="card"><h3>🧠 المدربون</h3><div class="grid"><div id="bc" class="coach"></div><div id="rc" class="coach"></div></div></div>
<div class="card"><h3>👥 اللاعبين المتاحين</h3><div id="pi"></div><div id="pool" class="players"></div></div><div class="card"><h3>📜 السجل</h3><div id="log" class="log"></div></div></div></section></div><div id="toast" class="toast"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAGKh-bNXYBVbv0BcIIxi8IHRZf4A0leSA",authDomain:"fc-auction-online.firebaseapp.com",databaseURL:"https://fc-auction-online-default-rtdb.europe-west1.firebasedatabase.app",projectId:"fc-auction-online",storageBucket:"fc-auction-online.firebasestorage.app",messagingSenderId:"131249827121",appId:"1:131249827121:web:eae71599ef1f8fda28d410"};
firebase.initializeApp(firebaseConfig);const db=firebase.database(),BASE="https://www.thesportsdb.com/api/v1/json/123";let ref,room,current,side,host=false,id=localStorage.fc_id||(localStorage.fc_id="p_"+Date.now()+Math.random());
const clubs=[[133604,"Premier League","Arsenal"],[133613,"Premier League","Manchester City"],[133615,"Premier League","Liverpool"],[133619,"Premier League","Manchester United"],[133632,"Premier League","Chelsea"],[133738,"La Liga","Real Madrid"],[133739,"La Liga","Barcelona"],[133664,"Bundesliga","Bayern Munich"],[133666,"Bundesliga","Borussia Dortmund"],[133714,"Ligue 1","Paris Saint-Germain"],[133681,"Serie A","Inter Milan"],[133679,"Serie A","AC Milan"],[133678,"Serie A","Juventus"],[139096,"Algeria","USM Alger"],[139283,"Algeria","MC Alger"],[139097,"Algeria","CR Belouizdad"],[139098,"Algeria","JS Kabylie"],[137650,"Tunisia","Esperance de Tunis"]];
const legends=["Pele","Diego Maradona","Zinedine Zidane","Ronaldinho","Ronaldo Nazario","Johan Cruyff","Franz Beckenbauer","Michel Platini","George Best","Garrincha","Puskas","Eusebio","Thierry Henry","Paolo Maldini","Kaka","David Beckham","Xavi","Andres Iniesta","Zlatan Ibrahimovic"];
const coaches=["Pep Guardiola","Carlo Ancelotti","Jurgen Klopp","Jose Mourinho","Zinedine Zidane","Diego Simeone","Luis Enrique","Mikel Arteta","Xabi Alonso","Hansi Flick","Thomas Tuchel","Antonio Conte","Simone Inzaghi","Massimiliano Allegri","Unai Emery","Didier Deschamps","Marcelo Bielsa","Jorge Jesus","Walid Regragui","Djamel Belmadi","Vladimir Petkovic","Abdelhak Benchikha","Frank Lampard","Steven Gerrard"];
const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),avatar=n=>"https://ui-avatars.com/api/?name="+encodeURIComponent(n)+"&background=10263b&color=fff&size=256",pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5),norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
db.ref(".info/connected").on("value",s=>{status.textContent=s.val()?"متصل بقاعدة البيانات ✅":"غير متصل بقاعدة البيانات ⚠️";status.className="status "+(s.val()?"online":"error")});
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function coach(n){return{id:"c_"+norm(n),name:n,rating:70+Math.floor(Math.random()*31),image:avatar(n)}}
function newCoach(ex=[]){let a=coaches.filter(x=>!ex.includes(x));return coach(pick(a.length?a:coaches))}
async function fetchClub(c){try{let d=await(await fetch(BASE+"/lookup_all_players.php?id="+c[0])).json();return(d.player||[]).map((p,i)=>({id:"p_"+(p.idPlayer||c[0]+"_"+i),name:p.strPlayer||"Player",position:p.strPosition||"CM",value:/algeria|tunisia/i.test(c[1])?35+Math.random()*60:60+Math.random()*100,image:p.strCutout||p.strThumb||avatar(p.strPlayer),club:c[2],league:c[1]}))}catch(e){return[]}}
async function fetchLegend(n){try{let d=await(await fetch(BASE+"/searchplayers.php?p="+encodeURIComponent(n))).json(),p=(d.player||[])[0];if(!p)return null;return{id:"l_"+(p.idPlayer||norm(n)),name:p.strPlayer||n,position:p.strPosition||"ST",value:170+Math.random()*30,image:p.strCutout||p.strThumb||avatar(n),club:"أسطورة",league:"Legends"}}catch(e){return null}}
async function makePool(){let a=(await Promise.all(shuffle(clubs).slice(0,16).map(fetchClub))).flat();a=a.concat((await Promise.all(shuffle(legends).slice(0,9).map(fetchLegend))).filter(Boolean));let s=new Set();return shuffle(a).filter(p=>{let k=norm(p.name);if(!k||s.has(k))return false;s.add(k);return true}).slice(0,500)}
function createRoom(){let n=document.getElementById("name1").value.trim();if(!n)return toast("اكتب اسمك");room=String(Math.random()).slice(2,8).toUpperCase();ref=db.ref("rooms/"+room);host=true;side="blue";ref.set({status:"waiting",players:{blue:{id,name:n,budget:200,team:[]},red:null},pool:[],used:[],recent:[],turn:"blue",auction:null,coaches:{blue:newCoach(),red:null},logs:[]}).then(()=>{show();listen()})}
async function joinRoom(){let n=document.getElementById("name2").value.trim(),c=document.getElementById("roomInput").value.trim().toUpperCase();if(!n||!c)return toast("أدخل الاسم والكود");let r=db.ref("rooms/"+c),s=await r.once("value");if(!s.exists())return toast("الغرفة غير موجودة");if(s.val().players.red)return toast("الغرفة ممتلئة");room=c;ref=r;side="red";await r.update({"players/red":{id,name:n,budget:200,team:[]},"coaches/red":newCoach([s.val().coaches.blue.name]),status:"ready"});show();listen()}
function show(){home.classList.add("hidden");document.getElementById("room").classList.remove("hidden");roomCode.textContent=room}
function listen(){ref.on("value",s=>{current=s.val();render()})}
function render(){if(!current)return;let b=current.players.blue,r=current.players.red;roomPlayers.innerHTML=`<div class="card">🔵 ${esc(b.name)}</div><div class="card">🔴 ${esc(r?.name||"انتظار")}</div>`;waiting.textContent=r?"اللاعبان جاهزان ✅":"في انتظار اللاعب الثاني";startBtn.classList.toggle("hidden",!(host&&r&&current.status!=="playing"));if(current.status==="playing")game.classList.remove("hidden"),draw()}
async function startAuction(){if(!host)return;toast("جاري تحميل لاعبين...");let pool=await makePool();if(pool.length<10)return toast("تعذر التحميل");let p=pick(pool);await ref.update({status:"playing",pool,used:[p.id],recent:[norm(p.name)],turn:"blue",auction:{player:p,price:0,highestSide:null,passes:{blue:false,red:false}},logs:[{text:"🔥 "+p.name+" ظهر في الوسط — البداية 0M"}]})}
async function bid(){let a=Number(amount.value),me=current.players[side],price=current.auction.price||0;if(current.turn!==side)return toast("انتظر دورك");if(!a||a<=price)return toast("لازم أعلى من "+price+"M");if(a>me.budget)return toast("رصيدك لا يكفي");await ref.update({auction:{...current.auction,price:a,highestSide:side,highest:me.name,passes:{blue:false,red:false}},turn:side==="blue"?"red":"blue",logs:[...(current.logs||[]),{text:"💰 "+me.name+" زايد "+a+"M"}]});amount.value=""}
async function pass(){if(current.turn!==side)return toast("انتظر دورك");let a={...current.auction.passes,[side]:true},other=side==="blue"?"red":"blue";if(current.auction.highestSide&&current.auction.highestSide!==side)return settle();if(a.blue&&a.red){let p=current.pool.find(x=>!current.used.includes(x.id));if(!p)return;let me=current.players[side];await ref.update({["players/"+side]:{...me,team:[...me.team,p]},used:[...current.used,p.id],auction:null,turn:other,logs:[...(current.logs||[]),{text:"🎁 لا أحد أراد اللاعب — لاعب مجاني: "+p.name}]});setTimeout(next,300);return}await ref.update({auction:{...current.auction,passes:a},turn:other})}
async function settle(){let s=current.auction.highestSide,p=current.auction.player,me=current.players[s],v=current.auction.price;if(v>me.budget)return;await ref.update({["players/"+s]:{...me,budget:me.budget-v,team:[...me.team,p]},used:[...current.used,p.id],auction:null,turn:s==="blue"?"red":"blue",logs:[...(current.logs||[]),{text:"🏆 "+me.name+" اشترى "+p.name+" بـ "+v+"M"}]});setTimeout(next,350)}
async function next(){if(!host||!current||current.auction)return;let p=current.pool.find(x=>!current.used.includes(x.id)&&!current.recent.includes(norm(x.name)));if(!p)p=current.pool.find(x=>!current.used.includes(x.id));if(!p)return;await ref.update({auction:{player:p,price:0,highestSide:null,passes:{blue:false,red:false}},used:[...current.used,p.id],recent:[...current.recent,norm(p.name)].slice(-8),turn:current.turn,logs:[...(current.logs||[]),{text:"🎲 لاعب جديد: "+p.name+" — 0M"}]})}
function draw(){let b=current.players.blue,r=current.players.red;bn.textContent=b.name;rn.textContent=r.name;bb.textContent=b.budget+"M";rb.textContent=r.budget+"M";bt.innerHTML=b.team.map(slot).join("");rt.innerHTML=r.team.map(slot).join("");bc.innerHTML=coachBox(current.coaches.blue);rc.innerHTML=coachBox(current.coaches.red);let a=current.auction;if(a){ai.src=a.player.image||avatar(a.player.name);an.textContent=a.player.name;ap.textContent=(a.player.position||"")+" • "+(a.player.club||"");pr.textContent=(a.price||0)+"M";turn.textContent=current.turn===side?"🎯 دورك":"⏳ دور الخصم";bid.disabled=current.turn!==side;pass.disabled=current.turn!==side}let rem=current.pool.filter(p=>!current.used.includes(p.id));pi.textContent="لاعبون كثيرون من الدوريات الكبرى والجزائر وتونس والأساطير. التكرار المباشر ممنوع.";pool.innerHTML=rem.slice(0,80).map(p=>`<div class="player"><img src="${esc(p.image||avatar(p.name))}"><b>${esc(p.name)}</b><small>${esc(p.position)} • ${Math.round(p.value)}M</small></div>`).join("");log.innerHTML=(current.logs||[]).slice().reverse().map(x=>"<div>• "+esc(x.text)+"</div>").join("")}
function slot(p){return`<div class="slot"><img src="${esc(p.image||avatar(p.name))}"><div>${esc(p.name)}</div><small>${esc(p.position||"")}</small></div>`}function coachBox(c){return`<img src="${esc(c.image)}"><div><b>${esc(c.name)}</b><small> تقييم ${c.rating}</small></div>`}
</script></body></html>
